<style>
:root{
  --bg:#E8EBE5;--panel:#F7F8F4;--soft:#E0E5DC;--ink:#1B2420;--muted:#5A665E;--line:#C9D0C6;
  --accent:#058B8C;--accent-ink:#FFFFFF;--sel:#CF7418;--canvas:#FBFCF9;--grid:#CAD2C7;
  --nodefill:#FFFFFF;--notefill:#FFF4D2;--contfill:#F3F6F0;--danger:#A8321F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614;--panel:#19201D;--soft:#232C28;--ink:#E2E8E3;--muted:#98A69D;--line:#313B36;
    --accent:#3DBDBE;--accent-ink:#04201F;--sel:#F0A04B;--canvas:#141A17;--grid:#2B3530;
    --nodefill:#1C2421;--notefill:#3A3421;--contfill:#18201C;--danger:#F0A395;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614;--panel:#19201D;--soft:#232C28;--ink:#E2E8E3;--muted:#98A69D;--line:#313B36;
  --accent:#3DBDBE;--accent-ink:#04201F;--sel:#F0A04B;--canvas:#141A17;--grid:#2B3530;
  --nodefill:#1C2421;--notefill:#3A3421;--contfill:#18201C;--danger:#F0A395;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:12px 16px 16px}
.top{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:600 20px/1 'IBM Plex Sans Condensed','Arial Narrow',sans-serif;letter-spacing:.01em}
.brand small{font:500 10.5px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.burger{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);height:40px;padding:0 13px 0 10px;border-radius:8px;cursor:pointer;font:500 13.5px/1 inherit}
.burger:hover{background:var(--soft)}
.gear{margin-left:auto;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}
.gear:hover{background:var(--soft)}.gear svg{transition:transform .3s}.gear:hover svg{transform:rotate(45deg)}
.setsec h3{font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--canvas)}
.seg button{display:flex;align-items:center;gap:8px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font:500 13.5px/1 inherit;padding:10px 16px;cursor:pointer}
.sethint{margin:8px 0 0!important;font-size:12.5px!important}.setgrid{display:grid;gap:18px}.setchk{cursor:pointer}.setchk input{width:16px;height:16px;accent-color:var(--accent)}.seg button:last-child{border-right:0}.seg button:hover{background:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.logo{flex:none;display:block}
.mbrand{display:flex;align-items:center;gap:10px}
.themebtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);height:40px;padding:0 13px 0 11px;border-radius:8px;cursor:pointer;font:500 13.5px/1 inherit}
.themebtn:hover{background:var(--soft)}
.themebtn svg{color:var(--accent)}
.cur{font-size:14px;font-weight:500;color:var(--muted);padding-left:16px;border-left:1px solid var(--line);line-height:26px}
.menu-wrap{position:fixed;inset:0;background:rgba(8,12,10,.38);z-index:9}
.menu{position:absolute;top:0;left:0;bottom:0;width:min(340px,100%);background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 24px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:4px 0 24px rgba(0,0,0,.12)}
.menu-head{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 6px}
.menu-head b{font:600 19px/1 'IBM Plex Sans Condensed','Arial Narrow',sans-serif}
.menu-head button{border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:6px;width:32px;height:32px;font-size:18px;cursor:pointer}
.menu h3{font:600 10.5px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.msub{display:flex;flex-direction:column;gap:1px}
.menu{display:flex;flex-direction:column}#menuBody{flex:1 0 auto;display:flex;flex-direction:column}.mfoot{margin-top:auto}
.mi{display:grid;grid-template-columns:22px 1fr auto;column-gap:12px;align-items:center;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px;border-radius:7px;cursor:pointer;font:13.5px/1.3 inherit}
.mi:hover{background:var(--soft)}
.mi>svg{color:var(--accent);grid-row:span 2}
.mi small{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.35}
.mi[aria-current="true"]{background:color-mix(in srgb,var(--accent) 13%,transparent);font-weight:600}
.mi .ok{grid-row:span 2;color:var(--accent);font-size:13px}
.mdoc{display:flex;align-items:center;gap:2px}
.mdoc .mi{flex:1;min-width:0}
.mdoc .mi span:not(.ok){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdel{flex:none;border:0;background:transparent;color:var(--muted);border-radius:6px;height:34px;min-width:34px;display:grid;place-items:center;cursor:pointer;font:600 12px/1 inherit;padding:0 6px}
.mdel:hover{background:var(--soft);color:var(--danger)}
.mdel.confirm{background:var(--danger);color:var(--panel)}
.cur small{margin-left:8px;font-size:12px;color:var(--muted);font-weight:400}
.cur{color:var(--ink)!important}
.mnote.copy{margin-top:6px;font-size:11.5px}
.mb .chooser-copy{margin:14px 0 0;font-size:11.5px;color:var(--muted);max-width:none}
.mb .about p{font-size:13.5px;color:var(--ink);margin:0 0 10px;max-width:none}
.ab-head{display:flex;gap:16px;align-items:center;margin:4px 0 16px}
.ab-head b{display:block;font:600 24px/1.1 'IBM Plex Sans Condensed','Arial Narrow',sans-serif}
.ab-head span{font:500 12px/1.4 'IBM Plex Mono',ui-monospace,monospace;color:var(--muted)}
.about .ab-copy{font-weight:600}
.mb .about .ab-small{font-size:12px;color:var(--muted)}
.mnote{font-size:12px;color:var(--muted);padding:2px 8px 4px;margin:0}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 14px}
.card{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:9px;padding:14px;cursor:pointer;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--canvas))}
.card svg{color:var(--accent);grid-row:span 2}
.card b{overflow-wrap:anywhere;hyphens:auto;font:600 15.5px/1.2 'IBM Plex Sans Condensed','Arial Narrow',sans-serif}
.card span{font-size:12.5px;color:var(--muted);line-height:1.4}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px;border:1px solid var(--line);overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);font:500 13.5px/1 inherit;padding:8px 13px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs .short{display:none}
.main{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px;min-height:0}
.palette,.props{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:auto;min-height:0}
.palette{padding:10px 8px 12px}
.palette h3{font:600 10.5px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px}
.pg{display:flex;flex-direction:column;gap:1px}
.tool{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font:13px/1.2 inherit;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left}
.tool:hover{background:var(--soft)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool svg{flex:none}
.lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:18px 8px 2px;cursor:pointer}
.work{display:grid;grid-template-rows:minmax(0,1fr);gap:8px;min-height:0;min-width:0}
.bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-wrap:nowrap;gap:8px;align-items:center;justify-content:center;max-width:calc(100% - 24px)}
.bar .grp{box-shadow:0 2px 10px rgba(0,0,0,.10)}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden}
.grp button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font:500 12.5px/1 inherit;padding:8px 11px;cursor:pointer;white-space:nowrap}
.grp button:last-child{border-right:0}
.grp button:hover:not(:disabled){background:var(--soft)}
.grp button:disabled{color:var(--muted);opacity:.5;cursor:default}
.zl{font:12px/1 'IBM Plex Mono',ui-monospace,monospace;min-width:54px;text-align:center;color:var(--muted);border-right:1px solid var(--line);padding:8px 4px;font-variant-numeric:tabular-nums}
.push{margin-left:auto}

.hint{position:absolute;left:10px;bottom:10px;right:10px;pointer-events:none;font-size:12px;color:var(--muted)}

.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);font-size:13.5px;text-align:center;padding:24px}

.props{padding:14px 14px 18px}

.fld.chk{flex-direction:row;align-items:center;gap:8px}

.fld small{color:var(--muted);font-size:11.5px;line-height:1.4}
.brow{border:1px solid var(--line);border-radius:8px;padding:10px 10px 4px;margin-bottom:10px;background:var(--canvas)}
.brow .fld{margin-bottom:8px}
.brdel{border:0;background:transparent;color:var(--danger);font:500 12px/1 inherit;padding:4px 0 8px;cursor:pointer}
.bradd{border:1px dashed var(--accent);background:transparent;color:var(--accent);font:600 12.5px/1 inherit;padding:9px 12px;border-radius:7px;cursor:pointer;width:100%}

.legend svg{color:var(--accent);margin-top:1px}
.legend b{display:block;font-weight:600}
.legend span{color:var(--muted)}
.steps{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink);display:grid;gap:5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13.5px;color:var(--muted);align-items:center}
kbd{font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--ink);background:var(--canvas);white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.modal{position:fixed;inset:0;background:rgba(8,12,10,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:88vh;overflow:auto;padding:16px 18px 18px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mh h2{font:600 18px/1.2 'IBM Plex Sans Condensed','Arial Narrow',sans-serif;margin:0}
.mh button{border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:6px;width:32px;height:32px;font-size:18px;cursor:pointer}
.mb p{margin:0 0 10px;font-size:13px;color:var(--muted)}

.mb img{display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;margin:6px 0 10px}
.mact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mact button,.mact label.btn{border:1px solid var(--line);background:var(--canvas);color:var(--ink);font:500 13px/1 inherit;padding:9px 13px;border-radius:6px;cursor:pointer}
.mact .pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mact .dng{background:var(--danger);border-color:var(--danger);color:#fff}
.grp button.ib{display:flex;align-items:center;justify-content:center;padding:6px 9px}.grp button.ib:hover:not(:disabled){color:var(--danger)}
.mact .st{font-size:12.5px;color:var(--muted)}
.mb a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .palette{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:6px}
  .palette h3{display:none}
  .pg{flex-direction:row}
  .tool span{display:none}
  .tool{padding:8px}
  .lock{margin:0 6px;white-space:nowrap}
  .work{height:68vh}
  .props{max-height:none}
}

  .themebtn span{display:none}

}

/* Zustandsdiagramm */
PU.state=function(lines,res){const nodes=[],edges=[],sk=res.skipped,byName={},pseudo={},scopes=[null];
  const sc=()=>scopes[scopes.length-1];
  const getS=(nm,create=true)=>{nm=PU.uq(nm);if(byName[nm])return byName[nm];if(!create)return null;const n={id:uid(),type:'state',x:0,y:0,name:nm,entry:'',doA:'',exit:'',inner:'',_p:sc()};nodes.push(n);byName[nm]=n;return n;};
  const ref=(tok,asT)=>{tok=tok.trim();if(tok==='[*]'){const k=sc()+'|'+(asT?'f':'i');if(!pseudo[k]){const n={id:uid(),type:asT?'final':'initial',x:0,y:0,_p:sc()};nodes.push(n);pseudo[k]=n;}return pseudo[k];}
    if(/^\[H\*?\]$/i.test(tok)){const deep=tok.includes('*'),k=sc()+'|H'+deep;if(!pseudo[k]){const n={id:uid(),type:'history',deep,x:0,y:0,_p:sc()};nodes.push(n);pseudo[k]=n;}return pseudo[k];}
    return getS(tok);};
  const desc=(n,t)=>{t=t.trim();let m;if((m=t.match(/^entry\s*\/\s*(.*)$/i)))n.entry=m[1];else if((m=t.match(/^do\s*\/\s*(.*)$/i)))n.doA=m[1];else if((m=t.match(/^exit\s*\/\s*(.*)$/i)))n.exit=m[1];else n.inner=(n.inner?n.inner+'\n':'')+t;};
  const notes=PU.noteHandler({find:nm=>getS(nm,false),add:(text,target,alias)=>{const n={id:uid(),type:'note',x:0,y:0,text,_p:target?target._p:sc()};nodes.push(n);if(alias)byName[alias]=n;if(target)edges.push({id:uid(),type:'anchor',from:n.id,to:target.id});},last:()=>nodes.filter(n=>n.type==='state').slice(-1)[0]});
  for(const l of lines){let m;
    if(l==='}'){if(scopes.length>1)scopes.pop();continue;}
    if(l==='--'||l==='||'){sk.push(l+' (parallele Bereiche)');continue;}
    if(notes(l))continue;
    if((m=l.match(/^state\s+(.+)$/i))){let rest=m[1],open=false,d0='';if(/\{\s*$/.test(rest)){open=true;rest=rest.replace(/\{\s*$/,'');}
      let stereo='';rest=rest.replace(/<<\s*([^>]+?)\s*>>/,(x,s)=>{stereo=s.toLowerCase();return'';}).replace(/#[\w#;:.]+/g,'');
      const ci=rest.search(/\s:\s|:\s|\s:$/);if(ci>=0&&!/^"/.test(rest.slice(ci))){d0=rest.slice(ci).replace(/^\s*:\s*/,'');rest=rest.slice(0,ci);}
      const dc=PU.decl(rest);if(!dc)continue;const n=getS(dc.alias);n.name=dc.name;byName[dc.name]=n;
      if(stereo==='choice'||stereo==='fork'||stereo==='join')n.type='choice';
      else if(stereo==='end')n.type='final';else if(stereo)sk.push('state '+dc.name+' <<'+stereo+'>> (als Zustand übernommen)');
      if(d0)desc(n,d0);
      if(open){n.type='composite';scopes.push(n.id);}continue;}
    const r=PU.rel(l,false);
    if(r){let a=r.left.v,b=r.right.v;let swap=r.L.includes('<')&&!r.R.includes('>');const A=ref(swap?b:a,false),B=ref(swap?a:b,true);
      const e={id:uid(),type:'transition',from:A.id,to:B.id};const t=r.label.match(/^(.*?)\s*(?:\[([^\]]*)\])?\s*(?:\/\s*(.*))?$/);
      if(t){if(t[1])e.trigger=t[1].trim();if(t[2])e.guard=t[2].trim();if(t[3])e.effect=t[3].trim();}edges.push(e);continue;}
    if((m=l.match(/^([^:]+?)\s*:\s*(.+)$/))){const n=getS(m[1]);desc(n,m[2]);continue;}
    sk.push(l);}
  const kids=pid=>nodes.filter(n=>n._p===pid);
  const anc=(id,pid)=>{let n=nodes.find(x=>x.id===id);while(n&&n._p!==pid){const p=n._p;n=nodes.find(x=>x.id===p);}return n?n.id:null;};
  const scope=pid=>{const ks=kids(pid);ks.filter(k=>k.type==='composite').forEach(k=>{const s=scope(k.id);k.w=Math.max(200,s.W+40);k.h=Math.max(110,s.H+70);});
    const items=ks.filter(k=>k.type!=='note').map(k=>({id:k.id,...PU.measure(STATE,k)}));
    const links=edges.filter(e=>e.type==='transition').map(e=>[anc(e.from,pid),anc(e.to,pid)]).filter(x=>x[0]&&x[1]);

  place(null,40,40);nodes.forEach(n=>delete n._p);
  return{type:'state',data:{title:res.title,nodes,edges}};};

/* Aktivitätsdiagramm */
PU.act=function(lines,res){const nodes=[],edges=[],sk=res.skipped,lanes=[];let lane=0,cur=[],stack=[],buf=null,skipNote=false;
  const mk=(type,p)=>{const n=Object.assign({id:uid(),type,x:0,y:0,_lane:lane},p||{});nodes.push(n);return n;};
  const link=(a,b,g)=>{const e={id:uid(),type:'flow',from:a.id,to:b.id};if(g)e.guard=g;edges.push(e);};
  const put=n=>{cur.forEach(c=>link(c.n,n,c.g));cur=[{n}];return n;};
  const oldStyle=lines.some(l=>/\(\*\)/.test(l));
  if(oldStyle){const by={};let init=null,fin=null;const getN=(t,asT)=>{t=t.trim();if(t==='(*)'){if(asT){fin=fin||mk('final');return fin;}init=init||mk('initial');return init;}
      const nm=PU.uq(t.replace(/^"|"$/g,''));if(!by[nm])by[nm]=mk('action',{name:nm});return by[nm];};
    let last=null;for(const l of lines){const r=PU.rel(l.replace(/^-+>/,'X->'),false);let m;
      if((m=l.match(/^-+>\s*(?:\[([^\]]*)\])?\s*(.+)$/))&&last){const B=getN(m[2],true);link(last,B,m[1]);last=B;continue;}
      if(r){const g=(r.right.v.match(/^\[([^\]]*)\]\s*/)||[])[1];const rt=r.right.v.replace(/^\[[^\]]*\]\s*/,'');const A=getN(r.left.v,false),B=getN(rt,true);link(A,B,g);last=B;continue;}
      sk.push(l);}}
  else for(let l of lines){let m;
    if(skipNote){if(/^end\s*note$/i.test(l))skipNote=false;continue;}
    if(buf!==null){buf.push(l);if(/[;|<>\]}/]$/.test(l)){const t=buf.join('\n').replace(/[;|<>\]}/]$/,'');buf=null;put(mk('action',{name:t}));}continue;}
    l=l.replace(/^#[\w#]+\s*:/,':');
    if((m=l.match(/^\|(?:#?[\w]+\|)?([^|]+)\|$/))){const nm=m[1].trim();let i=lanes.indexOf(nm);if(i<0){lanes.push(nm);i=lanes.length-1;}lane=i;continue;}
    if(/^start$/i.test(l)){put(mk('initial'));continue;}
    if(/^(stop|end)$/i.test(l)){put(mk('final'));cur=[];continue;}
    if(/^(kill|detach)$/i.test(l)){put(mk('flowfinal'));cur=[];continue;}
    if((m=l.match(/^:(.*)$/))){const body=m[1];if(/[;|<>\]}/]$/.test(body)){put(mk('action',{name:body.replace(/[;|<>\]}/]$/,'')}));}else buf=[body];continue;}
    if((m=l.match(/^if\s*\((.*?)\)\s*(?:then\s*(?:\((.*?)\))?)?\s*$/i))){const D=put(mk('decision',{name:m[1]}));stack.push({k:'if',D,ends:[],hasElse:false});cur=[{n:D,g:m[2]||''}];continue;}
    if((m=l.match(/^else\s*if\s*\((.*?)\)\s*(?:then\s*(?:\((.*?)\))?)?\s*$/i))){const f=stack[stack.length-1];if(f&&f.k==='if'){f.ends.push(...cur);cur=[{n:f.D,g:m[1]+(m[2]?' – '+m[2]:'')}];}continue;}
    if((m=l.match(/^else\s*(?:\((.*?)\))?\s*$/i))){const f=stack[stack.length-1];if(f&&f.k==='if'){f.ends.push(...cur);f.hasElse=true;cur=[{n:f.D,g:m[1]||'else'}];}continue;}
    if(/^end\s*if$/i.test(l)){const f=stack.pop();if(f&&f.k==='if'){f.ends.push(...cur);if(!f.hasElse)f.ends.push({n:f.D,g:'else'});const M=mk('decision',{name:''});f.ends.forEach(c=>link(c.n,M,c.g));cur=[{n:M}];}continue;}
    if((m=l.match(/^while\s*\((.*?)\)\s*(?:is\s*\((.*?)\))?\s*$/i))){const D=put(mk('decision',{name:m[1]}));stack.push({k:'while',D});cur=[{n:D,g:m[2]||''}];continue;}
    if((m=l.match(/^end\s*while\s*(?:\((.*?)\))?\s*$/i))){const f=stack.pop();if(f&&f.k==='while'){cur.forEach(c=>link(c.n,f.D,c.g));cur=[{n:f.D,g:m[1]||''}];}continue;}
    if(/^repeat$/i.test(l)){const R=put(mk('decision',{name:''}));stack.push({k:'repeat',R});continue;}
    if((m=l.match(/^repeat\s*while\s*\((.*?)\)\s*(?:is\s*\((.*?)\))?\s*(?:not\s*\((.*?)\))?\s*$/i))){const f=stack.pop();if(f&&f.k==='repeat'){const D=put(mk('decision',{name:m[1]}));link(D,f.R,m[2]||'');cur=[{n:D,g:m[3]||''}];}continue;}

    nodes.forEach(n=>{n.x=40+L.pos[n.id].x;n.y=40+32+30+L.pos[n.id].y;delete n._lane;});
    nodes.unshift({id:uid(),type:'partition',x:40,y:40,cols:lanes.map((nm,k)=>({name:nm,w:lw[k]})),rows:[],w:acc,h:L.H+60});}
  else{if(lanes.length===1)sk.push('Bereich |'+lanes[0]+'| (nur einer – ohne Aktivitätsbereich übernommen)');nodes.forEach(n=>{n.x=40+L.pos[n.id].x;n.y=40+L.pos[n.id].y;delete n._lane;});}

/* Anwendungsfalldiagramm */
PU.uc=function(lines,res){const nodes=[],edges=[],sk=res.skipped,map={};const scopes=[null];const sc=()=>scopes[scopes.length-1];
  const add=(type,name,alias)=>{const n={id:uid(),type,x:0,y:0,name:PU.uq(name),_p:type==='actor'||type==='actorbox'?null:sc()};if(type==='usecase')n.ext='';nodes.push(n);map[alias||name]=n;map[PU.uq(name)]=n;return n;};
  const resolve=t=>{if(t.k==='uc')return map[t.v]&&map[t.v].type==='usecase'?map[t.v]:add('usecase',t.v,t.v);if(t.k==='actor')return map[t.v]||add('actor',t.v,t.v);const v=PU.uq(t.v);return map[t.v]||map[v]||add('usecase',v,t.v);};
  const notes=PU.noteHandler({find:nm=>map[nm.trim()]||map[PU.uq(nm)],add:(text,target,alias)=>{const n={id:uid(),type:'note',x:0,y:0,text,_p:null};nodes.push(n);if(alias)map[alias]=n;if(target)edges.push({id:uid(),type:'anchor',from:n.id,to:target.id});},last:()=>nodes.slice(-1)[0]});
  for(const l of lines){let m;
    if(l==='}'){if(scopes.length>1)scopes.pop();continue;}
    if(notes(l))continue;
    if((m=l.match(/^actor\/?\s+(.+)$/i))){let rest=m[1].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'');const cm=rest.match(/^:([^:]+):\s*(?:as\s+(\S+))?/);if(cm){add('actor',cm[1],cm[2]||cm[1]);continue;}const d=PU.decl(rest);if(d)add('actor',d.name,d.alias);continue;}
    if((m=l.match(/^:([^:]+):\s*(?:as\s+(\S+))?\s*$/))){add('actor',m[1],m[2]||m[1]);continue;}
    if((m=l.match(/^usecase\/?\s+(.+)$/i))){let rest=m[1].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'');const pm=rest.match(/^\(([^)]+)\)\s*(?:as\s+(\S+))?/);if(pm){add('usecase',pm[1],pm[2]||pm[1]);continue;}const d=PU.decl(rest);if(d)add('usecase',d.name,d.alias);continue;}
    if((m=l.match(/^\(([^)]+)\)\s*(?:as\s+(\S+))?\s*$/))){add('usecase',m[1],m[2]||m[1]);continue;}
    if((m=l.match(/^(rectangle|package|frame|folder|node|cloud|component)\s+(.+?)\s*\{$/i))){const d=PU.decl(m[2].replace(/<<[^>]*>>/,''));const n={id:uid(),type:'system',x:0,y:0,name:d?d.name:'System',w:300,h:200,_p:sc()};nodes.push(n);if(d)map[d.alias]=n;scopes.push(n.id);continue;}
    if((m=l.match(/^rectangle\s+(.+?)\s*<<\s*Akteur\s*>>\s*(?:as\s+(\S+))?\s*$/i))){add('actorbox',PU.uq(m[1]),m[2]||PU.uq(m[1]));continue;}
    const r=PU.rel(l,true);
    if(r){const A=resolve(r.left),B=resolve(r.right);const lab=r.label.toLowerCase();let e;
      if(/include/.test(lab)){e={type:'include',from:A.id,to:B.id};if(r.L.includes('<')&&!r.R.includes('>'))e={type:'include',from:B.id,to:A.id};}
      else if(/extend/.test(lab)){e={type:'extend',from:A.id,to:B.id};if(r.L.includes('<')&&!r.R.includes('>'))e={type:'extend',from:B.id,to:A.id};}
      else if(/\|>|\^/.test(r.R))e={type:'generalization',from:A.id,to:B.id};else if(/<\|/.test(r.L))e={type:'generalization',from:B.id,to:A.id};
      else if(A.type==='note'||B.type==='note')e={type:'anchor',from:A.id,to:B.id};
      else{e={type:'assoc',from:A.id,to:B.id};if(r.R.includes('>'))e.nav2='arrow';if(r.L.includes('<'))e.nav1='arrow';if(r.m1)e.m1=r.m1;if(r.m2)e.m2=r.m2;}
      e.id=uid();edges.push(e);continue;}
    sk.push(l);}
  // Layout
  const meas=n=>PU.measure(UC,n);let ay=40;const actors=nodes.filter(n=>n.type==='actor'||n.type==='actorbox');
  const sysList=nodes.filter(n=>n.type==='system');const free=nodes.filter(n=>n.type==='usecase'&&!n._p);
  const layUC=(list,ox,oy)=>{const cols=list.length>4?2:1;let colH=[0,0];const cw=[0,0];list.forEach((u,i)=>{const s=meas(u);cw[i%cols]=Math.max(cw[i%cols],s.w);});
    list.forEach((u,i)=>{const s=meas(u),c=i%cols;u.x=Math.round(ox+(c?cw[0]+50:0)+(cw[c]-s.w)/2);u.y=Math.round(oy+colH[c]);colH[c]+=s.h+30;});

  let sx=40+Math.max(60,...actors.map(a=>meas(a).w))+100;let sy=40;

  if(free.length){const r=layUC(free,sx+(sysList.length?Math.max(...sysList.map(s=>s.w))+60:0),40);}
  const totalH=Math.max(sy,...nodes.filter(n=>n.type==='usecase').map(u=>u.y+60));const step=actors.length?Math.max(110,(totalH-40)/actors.length):110;
  actors.forEach((a,i)=>{a.x=40;a.y=Math.round(40+i*step);});
  let nx=Math.max(...nodes.filter(n=>n.type!=='note').map(n=>n.x+meas(n).w),300)+60,ny=40;nodes.filter(n=>n.type==='note').forEach(n=>{n.x=nx;n.y=ny;ny+=meas(n).h+30;});

/* Sequenzdiagramm */
PU.seq=function(lines,res){const parts=[],msgs=[],frags=[],by={},sk=res.skipped,pendingCreate=new Set(),calls=[],fst=[];let numbered=false,skipNote=false;
  const getP=(nm,kind)=>{nm=String(nm).trim();const u=PU.uq(nm);if(by[nm])return by[nm];if(by[u])return by[u];const p={id:uid(),kind:kind||'object',name:u};parts.push(p);by[nm]=p;by[u]=p;return p;};
  const OPS={alt:'alt',opt:'opt',loop:'loop',par:'par',break:'break',critical:'critical'};
  for(const l of lines){let m;
    if(skipNote){if(/^end\s*[hr]?note$/i.test(l))skipNote=false;continue;}
    if((m=l.match(/^(participant|actor|boundary|control|entity|database|collections|queue)\s+(.+)$/i))){const kw=m[1].toLowerCase();const rest=m[2].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'').replace(/\s+order\s+\d+/i,'');const d=PU.decl(rest);if(!d)continue;
      const p=getP(d.alias,kw==='actor'?'actor':'object');p.name=d.name;p.kind=kw==='actor'?'actor':'object';by[d.name]=p;if(kw!=='actor'&&kw!=='participant')sk.push(kw+' '+d.name+' (als Objekt übernommen)');continue;}
    if(/^autonumber\b/i.test(l)){numbered=true;continue;}
    if((m=l.match(/^create\s+(?:participant\s+|actor\s+)?(.+)$/i))){pendingCreate.add(getP(m[1]).id);continue;}
    if((m=l.match(/^destroy\s+(.+)$/i))){const p=getP(m[1]);const last=msgs[msgs.length-1];if(last&&last.to===p.id&&last.type==='sync')last.type='destroy';else p.endAt=last?last.id:'__end';continue;}
    if(/^(activate|deactivate)\b/i.test(l))continue;
    if((m=l.match(/^return\b\s*(.*)$/i))){const c=calls.pop();if(c)msgs.push({id:uid(),type:'reply',from:c.to,to:c.from,label:m[1]||''});continue;}
    if((m=l.match(/^(alt|opt|loop|par|break|critical|group|neg|strict|seq|ignore|consider|assert)\b\s*(.*)$/i))){const op=OPS[m[1].toLowerCase()]||'opt';if(!OPS[m[1].toLowerCase()])sk.push(m[1]+' (als opt übernommen)');fst.push({op,guard:m[2]||'',si:msgs.length,br:[]});continue;}
    if((m=l.match(/^else\b\s*(.*)$/i))){const f=fst[fst.length-1];if(f)f.br.push({i:msgs.length,guard:m[1]||''});continue;}
    if(/^end$/i.test(l)){const f=fst.pop();if(f&&msgs.length>f.si){frags.push({id:uid(),op:f.op,guard:f.guard,start:msgs[f.si].id,end:msgs[msgs.length-1].id,branches:f.br.filter(b=>b.i>f.si&&b.i<msgs.length).map(b=>({at:msgs[b.i].id,guard:b.guard}))});}continue;}
    if(/^[hr]?note\b/i.test(l)){if(!/:/.test(l))skipNote=true;sk.push('Notiz');continue;}

$('#b-keys').onclick=()=>{const c=C();const d=mk('div');d.innerHTML=`<div class="keys"><kbd>Entf</kbd><span>Auswahl löschen</span><kbd>Strg Z / Y</kbd><span>Rückgängig / Wiederholen</span>${c.seq?'':'<kbd>Strg D</kbd><span>Element duplizieren</span><kbd>Pfeiltasten</kbd><span>Auswahl verschieben (mit Umschalt: 1 px)</span>'}<kbd>Esc</kbd><span>Werkzeug abbrechen / Auswahl aufheben</span>${c.seq?'<kbd>Doppelklick</kbd><span>Name bzw. Beschriftung rechts markieren – direkt lostippen</span>':'<kbd>Umschalt + Klick</kbd><span>Mehrere Elemente auswählen, dann zusammen verschieben</span><kbd>Umschalt + Ziehen</kbd><span>Alle Elemente in einem Rahmen auswählen</span><kbd>Doppelklick Element</kbd><span>Name rechts markieren – direkt lostippen zum Umbenennen</span><kbd>Doppelklick Pfeil</kbd><span>Knickpunkt einfügen (auf Knickpunkt: entfernen)</span>'}</div>`;openModal('Tastenkürzel',[d]);};
$('#b-clear').innerHTML=icon('trash',16);
$('#b-clear').onclick=()=>{if(!hasContent()){toast('Das Diagramm ist bereits leer.');return;}const p=mk('p',null,'Alle Elemente von „'+(E().data.title||C().name)+'“ werden entfernt.');const p2=mk('p',null,'Mit Strg+Z lässt sich das rückgängig machen.');
  const a=mk('div',{className:'mact'});const by=mk('button',{className:'dng'},'Leeren');by.onclick=()=>{closeModal(true);ACTIONS.clear();};const bn=mk('button',null,'Abbrechen');bn.onclick=()=>closeModal(true);a.append(by,bn);openModal('Diagramm leeren?',[p,p2,a]);setTimeout(()=>bn.focus(),30);};
$('#b-undo').onclick=undo;$('#b-redo').onclick=redo;$('#b-zin').onclick=()=>zoomBy(1.2);$('#b-zout').onclick=()=>zoomBy(1/1.2);$('#b-fit').onclick=fit;

/* ---------- Theme ---------- */
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const THEME_IC={dark:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'};
const curTheme=()=>root.dataset.theme==='dark'||root.dataset.theme==='light'?root.dataset.theme:(mq.matches?'dark':'light');
function themePref(){let t=null;try{t=localStorage.getItem('umld-theme');}catch(_){}return t==='dark'||t==='system'?t:'light';}
function paintThemeBtn(){const t=themePref();document.querySelectorAll('.seg [data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));}
function segRow(title,opts,get,set,hint){const sec=mk('div',{className:'setsec'});sec.append(mk('h3',null,title));const seg=mk('div',{className:'seg'});seg.setAttribute('role','group');seg.setAttribute('aria-label',title);
  const paint=()=>seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(get()))));
  opts.forEach(([v,l,ic])=>{const b=mk('button',{type:'button'});b.dataset.v=String(v);if(v==='light'||v==='dark'||v==='system')b.dataset.themeSet=v;b.innerHTML=(ic?icon(ic,18):'')+'<span>'+esc(l)+'</span>';b.onclick=()=>{set(v);paint();};seg.append(b);});
  sec.append(seg);if(hint)sec.append(mk('p',{className:'sethint'},hint));paint();return sec;}
function setChk(title,label,get,set,hint){const sec=mk('div',{className:'setsec'});sec.append(mk('h3',null,title));const lab=mk('label',{className:'chk setchk'});const cb=mk('input',{type:'checkbox',checked:!!get()});cb.onchange=()=>set(cb.checked);lab.append(cb,' '+label);sec.append(lab);if(hint)sec.append(mk('p',{className:'sethint'},hint));return sec;}
function upd(k,v){SET[k]=v;saveSet();if(k==='font'){st0.textContent=ST0BASE+fontCSS();render();}else if(k==='grid')applyView();else if(k==='hints')renderProps();}
function settingsBox(){const g=mk('div',{className:'setgrid'});
  const th=segRow('Darstellung',[['light','Hell','sun'],['dark','Dunkel','moon'],['system','System','monitor']],themePref,setTheme,'„System“ übernimmt die Einstellung deines Betriebssystems und wechselt automatisch mit.');
  g.append(th,
    segRow('Raster anzeigen',[[true,'Ein'],[false,'Aus']],()=>SET.grid,v=>upd('grid',v),'Punktraster auf der Zeichenfläche. „Aus“ ist ruhiger für Screenshots und Beamer.'),
    segRow('Am Raster ausrichten',[[0,'Aus'],[10,'Fein (10 px)'],[20,'Grob (20 px)']],()=>SET.snap,v=>upd('snap',v),'Elemente springen beim Verschieben auf das Raster. „Grob“ entspricht den sichtbaren Rasterpunkten.'),
    segRow('Schriftgröße im Diagramm',[['normal','Normal'],['medium','Groß'],['large','Sehr groß']],()=>SET.font,v=>upd('font',v),'„Groß“ und „Sehr groß“ sind gut lesbar am Beamer. Elemente wachsen mit – bei dichten Diagrammen ggf. Abstände anpassen.'),
    segRow('Hinweise anzeigen',[[true,'Ein'],[false,'Aus']],()=>SET.hints,v=>upd('hints',v),'„So geht’s“ und Erklärungen in der rechten Leiste.'),
    segRow('PNG-Export: Auflösung',[[1,'1×'],[2,'2×'],[3,'3×']],()=>+SET.pngScale,v=>upd('pngScale',v),'Gilt für „Bild herunterladen“ und „Bild kopieren“. 3× für Druck und große Folien.'),
    segRow('PNG-Export: Hintergrund',[['white','Weiß'],['transparent','Transparent']],()=>SET.pngBg,v=>upd('pngBg',v),'Transparent eignet sich für farbige Folien.'));
  openModal('Einstellungen',[g]);}
$('#gear').innerHTML=icon('gear',20);$('#gear').onclick=()=>{closeMenu();settingsBox();};
function setTheme(t){if(t==='system')root.removeAttribute('data-theme');else root.dataset.theme=t;try{localStorage.setItem('umld-theme',t);}catch(_){}paintThemeBtn();}
{let t=null;try{t=localStorage.getItem('umld-theme');}catch(_){}if(t==='system')root.removeAttribute('data-theme');else root.dataset.theme=t==='dark'?'dark':'light';}
mq.addEventListener&&mq.addEventListener('change',paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(root,{attributes:true,attributeFilter:['data-theme']});
paintThemeBtn();

{const last=LS.get('umld-cur');const start=DOCS.find(d=>d.id===last)||[...DOCS].sort((a,b)=>b.updated-a.updated)[0];
  if(start)openDoc(start.id);else{buildPalette();buildMenu();chooser(true);}}
requestAnimationFrame(()=>{if(curDoc&&E().view&&E().view.k===1&&E().view.x===40)fit();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{render();});
window.addEventListener('pagehide',saveNow);
})();
